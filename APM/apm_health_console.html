<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APM Health Console</title>
<style>
:root{--bg:#0b1220;--pan:#121b2e;--pan2:#18233a;--line:#24314d;--ink:#e6ecf7;--mute:#8a98b5;--acc:#3fa9f5;
--g:#22c55e;--y:#eab308;--o:#f97316;--r:#ef4444}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:#0f1729;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}.top .src{font-size:11px;color:var(--mute)}
.crumb{font-size:13px;color:var(--mute);flex:1;min-width:200px}.crumb b{color:var(--ink)}
.top input{background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px;width:200px}
.app{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:12px;padding:12px;min-height:calc(100vh - 52px)}
.pan{background:var(--pan);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.pan h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:0 0 10px;font-weight:600}
.tree{font-size:13px;max-height:calc(100vh - 110px);overflow:auto}
.tn{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}
.tn:hover{background:var(--pan2)}.tn.sel{background:#1d3a5f;color:#fff}
.tn .tw{width:12px;color:var(--mute);font-size:10px;flex:none}
.tn .dot{width:8px;height:8px;border-radius:50%;flex:none}.tn .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.tn .pc{font-size:11px;color:var(--mute)}
.kids{margin-left:14px}
.center{display:flex;flex-direction:column;gap:12px;min-width:0}
.radial{display:flex;justify-content:center}.radial svg{width:100%;max-width:680px;height:auto}
.node{cursor:pointer}.node:hover circle.bgc{stroke:#3fa9f5}
.ind{margin:12px 0}.ind .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.ind .row b{font-variant-numeric:tabular-nums}
.scale{position:relative;height:8px;border-radius:4px}
.scale .mk{position:absolute;top:-4px;width:3px;height:16px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px #000}
.hl{background:linear-gradient(90deg,var(--r),var(--o) 40%,var(--y) 60%,var(--g) 80%)}
.lh{background:linear-gradient(90deg,var(--g),var(--y) 40%,var(--o) 60%,var(--r) 80%)}
.sq{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.sq div{border-radius:6px;padding:8px 4px;text-align:center;font-size:11px;color:#0b1220;font-weight:600}
.sq div span{display:block;font-size:20px}
.rec{background:var(--pan2);border-radius:6px;padding:10px;font-size:13px;line-height:1.5;margin-top:8px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;color:#0b1220}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--mute);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--pan);cursor:pointer}
td{padding:7px 8px;border-bottom:1px solid #1b2740}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--pan2)}
.tblw{max-height:300px;overflow:auto}
.btn{background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
.btn:focus,.tn:focus,.node:focus{outline:2px solid var(--acc)}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
@media (max-width:1100px){.app{grid-template-columns:1fr}.tree{max-height:260px}}
</style></head><body>

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL = v => v>=80?'#22c55e':v>=60?'#eab308':v>=40?'#f97316':'#ef4444';
const COLINV = v => COL(100-v);
const avg = (a,f) => { const s=a.filter(x=>x[f]!==null&&x[f]!==undefined); return s.length? s.reduce((t,x)=>t+(+x[f]),0)/s.length : null; };
const f1 = v => v===null||v===undefined ? 'n/a' : (+v).toFixed(1);
const money = n => (+n||0).toLocaleString(undefined,{maximumFractionDigits:0});

// ---------- build hierarchy: root > site > location > asset
const root = {id:'ROOT', name:'All sites', type:'Enterprise', kids:[], assets:ASSETS};
const byId = {ROOT:root};
for (const a of ASSETS){
  const sid='S|'+a.SITEID, lid='L|'+a.SITEID+'|'+(a.LOCATION||'(none)'), aid='A|'+a.ASSETNUM;
  if(!byId[sid]){byId[sid]={id:sid,name:a.SITEID,type:'Site',kids:[],assets:[],parent:root};root.kids.push(byId[sid]);}
  const s=byId[sid];
  if(!byId[lid]){byId[lid]={id:lid,name:a.LOCATION||'(none)',type:'Location',kids:[],assets:[],parent:s};s.kids.push(byId[lid]);}
  const l=byId[lid];
  const n={id:aid,name:a.ASSETNUM,type:'Asset',kids:[],assets:[a],asset:a,parent:l};
  byId[aid]=n; l.kids.push(n); l.assets.push(a); s.assets.push(a);
}
const sortKids = n => { n.kids.sort((x,y)=>x.name.localeCompare(y.name)); n.kids.forEach(sortKids); };
sortKids(root);
const ahiOf = n => avg(n.assets,'AHI');

let sel = root; const open = new Set(['ROOT']);

// ---------- tree
function treeHTML(n, filter){
  const match = !filter || n.assets.some(a => (a.ASSETNUM+' '+(a.DESCRIPTION||'')+' '+a.LOCATION).toLowerCase().includes(filter));
  if(!match) return '';
  const v = ahiOf(n), isOpen = open.has(n.id) || !!filter;
  const tw = n.kids.length ? (isOpen?'&#9662;':'&#9656;') : '';
  let h = `<div class="tn${sel===n?' sel':''}" data-id="${esc(n.id)}" role="treeitem" tabindex="0">
    <span class="tw">${tw}</span><span class="dot" style="background:${v===null?'#555':COL(v)}"></span>
    <span class="nm">${esc(n.name)}${n.type==='Asset'&&n.asset.DESCRIPTION?' · '+esc(n.asset.DESCRIPTION):''}</span>
    <span class="pc">${v===null?'':Math.round(v)+'%'}</span></div>`;
  if(n.kids.length && isOpen) h += `<div class="kids">${n.kids.map(k=>treeHTML(k,filter)).join('')}</div>`;
  return h;
}
function drawTree(){
  const f = $('q').value.trim().toLowerCase();
  $('tree').innerHTML = treeHTML(root, f);
  $('tree').querySelectorAll('.tn').forEach(el=>{
    const go=()=>{const n=byId[el.dataset.id]; if(sel===n && n.kids.length){open.has(n.id)?open.delete(n.id):open.add(n.id);} else {select(n);} drawTree();};
    el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
}

// ---------- radial
function ring(cx,cy,r,w,v,col){
  const c=2*Math.PI*r, p=Math.max(0,Math.min(100,v||0))/100;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#24314d" stroke-width="${w}"/>
   <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"
    stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${cx} ${cy})"/>`;
}
function childItems(n){
  if(n.type!=='Asset') return n.kids.map(k=>({label:k.name, sub:k.type==='Asset'?(k.asset.DESCRIPTION||''):`${k.assets.length} assets`, v:ahiOf(k), node:k}));
  const a=n.asset;
  return [['Failure history','FailureScore'],['PM compliance','PMScore'],['Condition','ConditionScore'],['Backlog','BacklogScore'],
          ['Completeness','Completeness'],['Validity','Validity'],['Accuracy','Accuracy'],['Consistency','Consistency'],['Timeliness','Timeliness']]
    .map(([l,k])=>({label:l, sub:k.endsWith('Score')?'Health driver':'Data quality', v:a[k], node:null}));
}
function drawRadial(){
  const W=680,H=560,cx=W/2,cy=H/2-10;
  let items = childItems(sel), more=0;
  if(items.length>12){ items=[...items].sort((x,y)=>(x.v??101)-(y.v??101)); more=items.length-12; items=items.slice(0,12); }
  const v = sel.type==='Asset' ? sel.asset.AHI : ahiOf(sel);
  const R=195;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Health summary">
   <defs><radialGradient id="glow"><stop offset="0" stop-color="#1d3a5f" stop-opacity=".9"/><stop offset="1" stop-color="#0b1220" stop-opacity="0"/></radialGradient></defs>
   <circle cx="${cx}" cy="${cy}" r="${R+40}" fill="url(#glow)"/>
   <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#24314d" stroke-dasharray="2 6"/>`;
  items.forEach((it,i)=>{
    const ang=-Math.PI/2 + i*2*Math.PI/items.length, x=cx+R*Math.cos(ang), y=cy+R*Math.sin(ang);
    s+=`<line x1="${cx+92*Math.cos(ang)}" y1="${cy+92*Math.sin(ang)}" x2="${x-30*Math.cos(ang)}" y2="${y-30*Math.sin(ang)}" stroke="#2c3b5c"/>`;
  });
  items.forEach((it,i)=>{
    const ang=-Math.PI/2 + i*2*Math.PI/items.length, x=cx+R*Math.cos(ang), y=cy+R*Math.sin(ang);
    const col = it.v===null||it.v===undefined ? '#555' : COL(it.v);
    const below = Math.sin(ang) > 0.3;
    s+=`<g class="node" ${it.node?`data-id="${esc(it.node.id)}" tabindex="0" role="button"`:''}>
      <circle class="bgc" cx="${x}" cy="${y}" r="29" fill="#121b2e" stroke="#24314d" stroke-width="2"/>
      ${ring(x,y,24,5,it.v,col)}
      <text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#e6ecf7">${it.v===null||it.v===undefined?'n/a':Math.round(it.v)+'%'}</text>
      <text x="${x}" y="${below?y+46:y-38}" text-anchor="middle" font-size="11.5" fill="#e6ecf7">${esc(String(it.label).slice(0,18))}</text>
      <text x="${x}" y="${below?y+59:y-52+0}" text-anchor="middle" font-size="10" fill="#8a98b5">${esc(String(it.sub).slice(0,22))}</text>
      <title>${esc(it.label)} — ${f1(it.v)}</title></g>`;
  });
  s+=`${ring(cx,cy,78,14,v,v===null?'#555':COL(v))}
   <text x="${cx}" y="${cy-18}" text-anchor="middle" font-size="12" fill="#8a98b5">${esc(sel.type)} health</text>
   <text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="40" font-weight="700" fill="${v===null?'#888':COL(v)}">${v===null?'n/a':Math.round(v)+'%'}</text>
   <text x="${cx}" y="${cy+40}" text-anchor="middle" font-size="12" fill="#e6ecf7">${esc(sel.name)}</text>`;
  if(more) s+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="#8a98b5">Showing 12 lowest-health children · +${more} more in table below</text>`;
  $('radial').innerHTML = s+'</svg>';
  $('radial').querySelectorAll('.node[data-id]').forEach(el=>{
    const go=()=>{select(byId[el.dataset.id]); drawTree();};
    el.addEventListener('click',go); el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
}

// ---------- right panel
function indicator(label,v,inverse,suffix=''){
  const p=v===null||v===undefined?null:Math.max(0,Math.min(100,v));
  return `<div class="ind"><div class="row"><span>${label}</span><b style="color:${p===null?'#888':(inverse?COLINV(p):COL(p))}">${f1(v)}${p===null?'':suffix}</b></div>
   <div class="scale ${inverse?'lh':'hl'}">${p===null?'':`<div class="mk" style="left:calc(${p}% - 1px)"></div>`}</div></div>`;
}
function drawRight(){
  const A=sel.assets, one=sel.type==='Asset'?sel.asset:null;
  const g=k=> one? one[k] : avg(A,k);
  $('inds').innerHTML = indicator('Health (AHI)',g('AHI'),false)
    + indicator('Criticality (ACI)',g('ACI'),true)
    + indicator('Risk score',g('RiskScore'),true)
    + indicator('Data quality (ADQS)',g('ADQS'),false)
    + ['Completeness','Validity','Accuracy','Consistency','Timeliness'].map(k=>indicator('&nbsp;&nbsp;'+k,g(k),false)).join('');
  const bands=[['Good','#22c55e'],['Fair','#eab308'],['Poor','#f97316'],['Critical','#ef4444']];
  $('sq').innerHTML = bands.map(([b,c])=>`<div style="background:${c}"><span>${A.filter(x=>x.HealthBand===b).length}</span>${b}</div>`).join('');
  if(one){
    $('rec').innerHTML = `<div class="rec"><div><b>${esc(one.Quadrant)}</b> · ${esc(one.QuadrantName)}</div>
      <div style="margin:6px 0"><span class="pill" style="background:${one.Quadrant==='Q1'?'#ef4444':one.Quadrant==='Q2'?'#f97316':one.Quadrant==='Q3'?'#eab308':'#22c55e'}">${esc(one.Strategy)}</span>
      &nbsp;<span class="pill" style="background:#3fa9f5">${esc(one.Action)} · ${esc(one.Horizon)}</span></div>
      <div style="color:#c3cde0">${esc(one.Approach)}</div>
      <div style="margin-top:8px;color:#8a98b5">Risk rank #${one.RiskRank} · Maint cost ${money(one.MaintCost)} · Confidence ${esc(one.Confidence)}</div>
      ${one.FailedRules?`<div style="margin-top:8px;color:#f97316">Data gaps: ${esc(one.FailedRules)}</div>`:''}</div>`;
  } else {
    const q=k=>A.filter(x=>x.Quadrant===k).length;
    const worst=[...A].sort((x,y)=>y.RiskScore-x.RiskScore)[0];
    $('rec').innerHTML = `<div class="rec">
      <div><span class="pill" style="background:#ef4444">Q1 Act now: ${q('Q1')}</span> <span class="pill" style="background:#f97316">Q2: ${q('Q2')}</span>
      <span class="pill" style="background:#eab308">Q3: ${q('Q3')}</span> <span class="pill" style="background:#22c55e">Q4: ${q('Q4')}</span></div>
      <div style="margin-top:8px">Investment candidates: <b>${A.filter(x=>x.Action==='Replace'||x.Action==='Refurbish / Overhaul').length}</b> of ${A.length} assets</div>
      ${worst?`<div style="margin-top:6px;color:#c3cde0">Highest risk: <b>${esc(worst.ASSETNUM)}</b> ${esc(worst.DESCRIPTION||'')} (risk ${f1(worst.RiskScore)})</div>`:''}
      <div style="margin-top:6px;color:#8a98b5">${A.filter(x=>x.DataFlag&&x.DataFlag!=='OK').length} assets need data verification before action</div></div>`;
  }
}

let sortK=null, sortD=1;
function drawSub(){
  let rows, cols;
  if(sel.type==='Asset'){
    $('subt').textContent='Health drivers & data-quality dimensions';
    rows=childItems(sel).map(x=>({Name:x.label,Group:x.sub,Score:x.v}));
    cols=[['Name','Component'],['Group','Group'],['Score','Score']];
  } else {
    $('subt').textContent=`Sub-components of ${sel.name} (${sel.kids.length})`;
    rows=sel.kids.map(k=>{const a=k.asset;return {id:k.id,Name:k.name,Desc:a?(a.DESCRIPTION||''):k.type+' · '+k.assets.length+' assets',
      AHI:a?a.AHI:ahiOf(k),ACI:a?a.ACI:avg(k.assets,'ACI'),ADQS:a?a.ADQS:avg(k.assets,'ADQS'),
      Risk:a?a.RiskScore:avg(k.assets,'RiskScore'),Quad:a?a.Quadrant:k.assets.filter(x=>x.Quadrant==='Q1').length+' in Q1'};});
    cols=[['Name','Name'],['Desc','Description'],['AHI','AHI'],['ACI','ACI'],['ADQS','ADQS'],['Risk','Risk'],['Quad','Quadrant']];
  }
  if(sortK && rows.length && sortK in rows[0]) rows.sort((x,y)=>(x[sortK]>y[sortK]?1:x[sortK]<y[sortK]?-1:0)*sortD);
  const cell=(k,v)=> typeof v==='number' ? `<b style="color:${k==='ACI'||k==='Risk'?COLINV(v):COL(v)}">${f1(v)}</b>` : (v===null||v===undefined?'<span style="color:#666">n/a</span>':esc(v));
  $('sub').innerHTML=`<table><thead><tr>${cols.map(([k,h])=>`<th data-k="${k}">${h}${sortK===k?(sortD>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
   <tbody>${rows.map(r=>`<tr ${r.id?`data-id="${esc(r.id)}"`:''}>${cols.map(([k])=>`<td>${cell(k,r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  $('sub').querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.k;sortD=sortK===k?-sortD:1;sortK=k;drawSub();}));
  $('sub').querySelectorAll('tr[data-id]').forEach(tr=>tr.addEventListener('click',()=>{select(byId[tr.dataset.id]);drawTree();}));
}

function select(n){
  sel=n; let p=n; while(p){open.add(p.id); p=p.parent;}
  const path=[]; p=n; while(p){path.unshift(p); p=p.parent;}
  $('crumb').innerHTML=path.map((x,i)=>i===path.length-1?`<b>${esc(x.name)}</b>`:esc(x.name)).join(' &rsaquo; ');
  $('up').disabled=!n.parent;
  drawRadial(); drawRight(); drawSub();
}
$('up').addEventListener('click',()=>{if(sel.parent){select(sel.parent);drawTree();}});
$('q').addEventListener('input',drawTree);
select(root); drawTree();
</script></body></html>
